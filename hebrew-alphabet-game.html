<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>משחק האותיות</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}

    body{
      font-family:'Segoe UI',Arial,sans-serif;
      background:linear-gradient(135deg,#ffecd2 0%,#fcb69f 50%,#a1c4fd 100%);
      min-height:100vh;display:flex;flex-direction:column;
      align-items:center;justify-content:center;
      overflow-x:hidden;user-select:none;
    }

    /* ── background blobs ── */
    .bg-shapes{position:fixed;inset:0;pointer-events:none;z-index:0}
    .shape{position:absolute;border-radius:50%;opacity:.18;animation:float 6s ease-in-out infinite}
    .shape:nth-child(1){width:120px;height:120px;background:#ff6b6b;top:5%;left:10%;animation-delay:0s}
    .shape:nth-child(2){width:80px;height:80px;background:#ffd93d;top:15%;left:75%;animation-delay:1s}
    .shape:nth-child(3){width:160px;height:160px;background:#6bcb77;top:65%;left:5%;animation-delay:2s}
    .shape:nth-child(4){width:100px;height:100px;background:#4d96ff;top:70%;left:80%;animation-delay:.5s}
    .shape:nth-child(5){width:60px;height:60px;background:#ff6b6b;top:40%;left:90%;animation-delay:1.5s}
    .shape:nth-child(6){width:90px;height:90px;background:#c77dff;top:85%;left:45%;animation-delay:3s}
    @keyframes float{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-20px) scale(1.05)}}

    /* ── card ── */
    .game-card{
      position:relative;z-index:1;
      background:rgba(255,255,255,.9);
      backdrop-filter:blur(12px);
      border-radius:32px;
      padding:28px 36px 36px;
      max-width:700px;width:96%;
      box-shadow:0 20px 60px rgba(0,0,0,.15),0 4px 16px rgba(0,0,0,.08);
      text-align:center;
    }

    /* ── top bar ── */
    .score-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
    .pill{
      background:linear-gradient(135deg,#667eea,#764ba2);
      color:#fff;border-radius:20px;padding:5px 18px;
      font-size:1rem;font-weight:700;
      box-shadow:0 4px 12px rgba(102,126,234,.35);
    }

    /* ── mode badge ── */
    .mode-badge{
      display:inline-block;
      background:linear-gradient(135deg,#f093fb,#f5576c);
      color:#fff;border-radius:14px;padding:5px 18px;
      font-size:1rem;font-weight:700;
      margin-bottom:14px;
      box-shadow:0 4px 12px rgba(240,93,251,.3);
    }

    /* ── prompt area ── */
    .prompt-row{
      display:flex;align-items:center;justify-content:center;
      gap:14px;margin-bottom:24px;
    }
    .speak-btn{
      background:linear-gradient(135deg,#43e97b,#38f9d7);
      border:none;border-radius:50%;
      width:56px;height:56px;font-size:1.7rem;
      cursor:pointer;box-shadow:0 4px 14px rgba(67,233,123,.4);
      transition:transform .15s;flex-shrink:0;
    }
    .speak-btn:hover{transform:scale(1.12)}
    .speak-btn:active{transform:scale(.95)}

    /* Mode A: big display letter (inside picture mode) */
    .display-letter{
      font-size:5rem;font-weight:900;line-height:1;
      background:linear-gradient(135deg,#667eea,#764ba2);
      -webkit-background-clip:text;-webkit-text-fill-color:transparent;
      background-clip:text;
    }

    /* ── letter cards (Mode A) ── */
    .letters-grid{
      display:flex;gap:16px;justify-content:center;margin-bottom:20px;
      flex-wrap:wrap;
    }
    .letter-card{
      width:150px;height:150px;
      border-radius:24px;
      display:flex;align-items:center;justify-content:center;
      font-size:5rem;font-weight:900;
      cursor:pointer;
      border:4px solid transparent;
      transition:transform .15s,box-shadow .15s,border-color .15s,opacity .3s;
      box-shadow:0 8px 24px rgba(0,0,0,.12);
    }
    .letter-card:nth-child(1){background:linear-gradient(135deg,#ffeaa7,#fdcb6e);color:#6c4a00}
    .letter-card:nth-child(2){background:linear-gradient(135deg,#a29bfe,#6c5ce7);color:#fff}
    .letter-card:nth-child(3){background:linear-gradient(135deg,#55efc4,#00b894);color:#004d39}

    /* ── picture cards (Mode B) ── */
    .pictures-grid{
      display:flex;gap:14px;justify-content:center;margin-bottom:20px;
      flex-wrap:wrap;
    }
    .picture-card{
      width:165px;
      border-radius:22px;
      display:flex;flex-direction:column;align-items:center;
      padding:16px 10px 12px;
      cursor:pointer;
      border:4px solid transparent;
      transition:transform .15s,box-shadow .15s,border-color .15s,opacity .3s;
      box-shadow:0 8px 24px rgba(0,0,0,.12);
      gap:10px;
    }
    .picture-card:nth-child(1){background:linear-gradient(135deg,#ffeaa7,#fdcb6e)}
    .picture-card:nth-child(2){background:linear-gradient(135deg,#dfe6fb,#a29bfe)}
    .picture-card:nth-child(3){background:linear-gradient(135deg,#b8f5db,#55efc4)}
    .pic-emoji{font-size:4rem;line-height:1}
    .pic-word{
      font-size:1.1rem;font-weight:800;color:#333;
      background:rgba(255,255,255,.55);
      border-radius:10px;padding:3px 10px;
      white-space:nowrap;
    }

    /* ── shared card states ── */
    .letter-card:hover:not(.disabled):not(.eliminated),
    .picture-card:hover:not(.disabled):not(.eliminated){
      transform:translateY(-5px) scale(1.04);
      box-shadow:0 16px 40px rgba(0,0,0,.2);
    }
    .letter-card:active:not(.disabled):not(.eliminated),
    .picture-card:active:not(.disabled):not(.eliminated){transform:scale(.97)}

    .card-correct{border-color:#00b894!important;animation:bounce-correct .5s ease}
    .card-wrong{border-color:#e17055!important;animation:shake-wrong .45s ease}
    .eliminated{opacity:.3;cursor:default;pointer-events:none}
    .disabled{cursor:default;pointer-events:none}

    @keyframes bounce-correct{
      0%{transform:scale(1)}30%{transform:scale(1.22)}60%{transform:scale(.93)}100%{transform:scale(1)}
    }
    @keyframes shake-wrong{
      0%,100%{transform:translateX(0)}
      20%{transform:translateX(-9px)}40%{transform:translateX(9px)}
      60%{transform:translateX(-7px)}80%{transform:translateX(7px)}
    }

    /* ── feedback ── */
    .feedback{
      font-size:1.45rem;font-weight:800;min-height:2.4rem;
      display:flex;align-items:center;justify-content:center;
      border-radius:14px;padding:6px 20px;transition:opacity .3s;
    }
    .fb-correct{color:#00b894;background:rgba(0,184,148,.1)}
    .fb-wrong{color:#e17055;background:rgba(225,112,85,.1)}
    .fb-empty{color:transparent;background:transparent}

    /* ── next button ── */
    .next-btn{
      display:none;margin:16px auto 0;
      background:linear-gradient(135deg,#667eea,#764ba2);
      color:#fff;border:none;border-radius:50px;
      padding:14px 44px;font-size:1.3rem;font-weight:800;
      cursor:pointer;box-shadow:0 8px 24px rgba(102,126,234,.4);
      transition:transform .15s,box-shadow .15s;
    }
    .next-btn:hover{transform:translateY(-3px);box-shadow:0 12px 32px rgba(102,126,234,.55)}
    .next-btn:active{transform:scale(.97)}
    .next-btn.visible{display:inline-block;animation:pop-in .3s ease}
    @keyframes pop-in{0%{transform:scale(.5);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}

    /* ── confetti ── */
    #confetti-canvas{position:fixed;inset:0;pointer-events:none;z-index:10}

    /* ── responsive ── */
    @media(max-width:480px){
      .game-card{padding:20px 14px 28px}
      .letter-card{width:100px;height:100px;font-size:3.5rem;border-radius:18px}
      .picture-card{width:105px;padding:10px 6px 8px}
      .pic-emoji{font-size:3rem}
      .pic-word{font-size:.9rem}
      .display-letter{font-size:3.8rem}
    }
  </style>
</head>
<body>

<div class="bg-shapes">
  <div class="shape"></div><div class="shape"></div><div class="shape"></div>
  <div class="shape"></div><div class="shape"></div><div class="shape"></div>
</div>
<canvas id="confetti-canvas"></canvas>

<div class="game-card">
  <div class="score-bar">
    <div class="pill">⭐ <span id="score">0</span></div>
    <div class="pill">סיבוב <span id="round">1</span></div>
  </div>

  <div class="mode-badge" id="mode-badge">מצא את האות</div>

  <!-- prompt row: letter (mode B) / nothing (mode A) + speak button -->
  <div class="prompt-row">
    <div class="display-letter" id="display-letter" style="display:none"></div>
    <button class="speak-btn" id="speak-btn" onclick="replayAudio()" title="השמע שוב">🔊</button>
  </div>

  <!-- letter cards — mode A -->
  <div class="letters-grid" id="letters-grid"></div>

  <!-- picture cards — mode B -->
  <div class="pictures-grid" id="pictures-grid"></div>

  <div class="feedback fb-empty" id="feedback">‎</div>
  <button class="next-btn" id="next-btn" onclick="nextRound()">הבא ➜</button>
</div>

<script>
// ═══════════════════════════════════════════════════════
//  DATA
// ═══════════════════════════════════════════════════════
const ALEPH_BET = [
  {letter:'א',name:'אלף'},{letter:'ב',name:'בית'},{letter:'ג',name:'גימל'},
  {letter:'ד',name:'דלת'},{letter:'ה',name:'הא'},{letter:'ו',name:'וו'},
  {letter:'ז',name:'זין'},{letter:'ח',name:'חית'},{letter:'ט',name:'טית'},
  {letter:'י',name:'יוד'},{letter:'כ',name:'כף'},{letter:'ל',name:'למד'},
  {letter:'מ',name:'מם'},{letter:'נ',name:'נון'},{letter:'ס',name:'סמך'},
  {letter:'ע',name:'עין'},{letter:'פ',name:'פה'},{letter:'צ',name:'צדי'},
  {letter:'ק',name:'קוף'},{letter:'ר',name:'ריש'},{letter:'ש',name:'שין'},
  {letter:'ת',name:'תו'},
];

// words with emoji pictures — keyed by starting letter
const WORD_DB = [
  {letter:'א',emoji:'🦁',word:'אריה'},
  {letter:'א',emoji:'🐰',word:'ארנב'},
  {letter:'א',emoji:'🍉',word:'אבטיח'},
  {letter:'א',emoji:'✈️',word:'אווירון'},
  {letter:'ב',emoji:'🦆',word:'ברווז'},
  {letter:'ב',emoji:'🏠',word:'בית'},
  {letter:'ב',emoji:'🎈',word:'בלון'},
  {letter:'ב',emoji:'🍌',word:'בננה'},
  {letter:'ג',emoji:'🐪',word:'גמל'},
  {letter:'ג',emoji:'🥕',word:'גזר'},
  {letter:'ג',emoji:'🍦',word:'גלידה'},
  {letter:'ד',emoji:'🐟',word:'דג'},
  {letter:'ד',emoji:'🧸',word:'דובי'},
  {letter:'ד',emoji:'🍯',word:'דבש'},
  {letter:'ה',emoji:'⛰️',word:'הר'},
  {letter:'ה',emoji:'🚁',word:'הליקופטר'},
  {letter:'ה',emoji:'🛞',word:'הגה'},
  {letter:'ו',emoji:'🌹',word:'ורד'},
  {letter:'ו',emoji:'🧇',word:'וופל'},
  {letter:'ז',emoji:'🦓',word:'זברה'},
  {letter:'ז',emoji:'🐛',word:'זחל'},
  {letter:'ז',emoji:'🫒',word:'זית'},
  {letter:'ח',emoji:'🐱',word:'חתול'},
  {letter:'ח',emoji:'🥛',word:'חלב'},
  {letter:'ח',emoji:'🌻',word:'חמנייה'},
  {letter:'ט',emoji:'🐯',word:'טיגריס'},
  {letter:'ט',emoji:'📱',word:'טלפון'},
  {letter:'ט',emoji:'🍞',word:'טוסט'},
  {letter:'י',emoji:'👦',word:'ילד'},
  {letter:'י',emoji:'🌊',word:'ים'},
  {letter:'י',emoji:'🕊️',word:'יונה'},
  {letter:'כ',emoji:'🐕',word:'כלב'},
  {letter:'כ',emoji:'⭐',word:'כוכב'},
  {letter:'כ',emoji:'⚽',word:'כדור'},
  {letter:'ל',emoji:'❤️',word:'לב'},
  {letter:'ל',emoji:'🍋',word:'לימון'},
  {letter:'ל',emoji:'🐋',word:'לוויתן'},
  {letter:'מ',emoji:'🚗',word:'מכונית'},
  {letter:'מ',emoji:'✈️',word:'מטוס'},
  {letter:'מ',emoji:'☂️',word:'מטרייה'},
  {letter:'נ',emoji:'🐍',word:'נחש'},
  {letter:'נ',emoji:'🕯️',word:'נר'},
  {letter:'נ',emoji:'🐆',word:'נמר'},
  {letter:'ס',emoji:'🐎',word:'סוס'},
  {letter:'ס',emoji:'⛵',word:'סירה'},
  {letter:'ס',emoji:'🍬',word:'סוכרייה'},
  {letter:'ע',emoji:'🌳',word:'עץ'},
  {letter:'ע',emoji:'🐭',word:'עכבר'},
  {letter:'ע',emoji:'☁️',word:'ענן'},
  {letter:'פ',emoji:'🐘',word:'פיל'},
  {letter:'פ',emoji:'🐄',word:'פרה'},
  {letter:'פ',emoji:'🦋',word:'פרפר'},
  {letter:'פ',emoji:'🌸',word:'פרח'},
  {letter:'צ',emoji:'🐢',word:'צב'},
  {letter:'צ',emoji:'🐦',word:'ציפור'},
  {letter:'צ',emoji:'🐸',word:'צפרדע'},
  {letter:'ק',emoji:'🐒',word:'קוף'},
  {letter:'ק',emoji:'🦔',word:'קיפוד'},
  {letter:'ק',emoji:'🧱',word:'קיר'},
  {letter:'ר',emoji:'🚂',word:'רכבת'},
  {letter:'ר',emoji:'🐑',word:'רחל'},
  {letter:'ר',emoji:'🫙',word:'ריבה'},
  {letter:'ש',emoji:'☀️',word:'שמש'},
  {letter:'ש',emoji:'🐇',word:'שפן'},
  {letter:'ש',emoji:'🍫',word:'שוקולד'},
  {letter:'ת',emoji:'🍓',word:'תות'},
  {letter:'ת',emoji:'🍎',word:'תפוח'},
  {letter:'ת',emoji:'🐊',word:'תנין'},
];

// ═══════════════════════════════════════════════════════
//  STATE
// ═══════════════════════════════════════════════════════
let score = 0, round = 1;
let mode = 'letter';      // 'letter' | 'picture'
let currentAudio = null;  // what to speak
let answered = false;
let recentLetters = [];

// ═══════════════════════════════════════════════════════
//  TTS
// ═══════════════════════════════════════════════════════
function speak(text) {
  if (!window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'he-IL';
  u.rate = 0.82;
  u.pitch = 1.15;
  // prefer a Hebrew voice if available
  const voices = window.speechSynthesis.getVoices();
  const heVoice = voices.find(v => v.lang.startsWith('he'));
  if (heVoice) u.voice = heVoice;
  window.speechSynthesis.speak(u);
}

function replayAudio() { if (currentAudio) speak(currentAudio); }

// ═══════════════════════════════════════════════════════
//  UTILS
// ═══════════════════════════════════════════════════════
function rand(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

function pick3Letters() {
  const pool = ALEPH_BET.filter(l => !recentLetters.includes(l.letter));
  const src  = pool.length >= 3 ? pool : ALEPH_BET;
  const arr  = [...src].sort(() => Math.random() - .5).slice(0, 3);
  arr.forEach(l => recentLetters.push(l.letter));
  if (recentLetters.length > 8) recentLetters = recentLetters.slice(-8);
  return arr;
}

function shuffle(arr) { return [...arr].sort(() => Math.random() - .5); }

function setFeedback(text, cls) {
  const el = document.getElementById('feedback');
  el.textContent = text || '\u200F';
  el.className = 'feedback ' + (cls || 'fb-empty');
}

// ═══════════════════════════════════════════════════════
//  ROUND LOGIC
// ═══════════════════════════════════════════════════════
function nextRound() {
  answered = false;
  setFeedback('', 'fb-empty');
  document.getElementById('next-btn').classList.remove('visible');
  document.getElementById('round').textContent = round;
  document.getElementById('score').textContent = score;

  // alternate modes
  mode = (round % 2 === 1) ? 'letter' : 'picture';

  if (mode === 'letter') buildLetterRound();
  else                   buildPictureRound();

  // slight delay so voices load on first visit
  setTimeout(() => speak(currentAudio), 300);
}

// ─── Mode A: find the letter ───────────────────────────
function buildLetterRound() {
  document.getElementById('mode-badge').textContent = 'מצא את האות 🔡';
  document.getElementById('display-letter').style.display = 'none';
  document.getElementById('pictures-grid').innerHTML = '';
  document.getElementById('letters-grid').style.display = '';

  const three   = shuffle(pick3Letters());
  const correct = rand(three);
  currentAudio  = correct.name;

  const grid = document.getElementById('letters-grid');
  grid.innerHTML = '';
  three.forEach((item, i) => {
    const card = document.createElement('div');
    card.className = 'letter-card';
    card.textContent = item.letter;
    card.addEventListener('click', () => onPick(card, item.letter === correct.letter));
    grid.appendChild(card);
  });
}

// ─── Mode B: find the picture ──────────────────────────
function buildPictureRound() {
  document.getElementById('mode-badge').textContent = 'מה מתחיל ב... 🖼️';
  document.getElementById('letters-grid').innerHTML = '';

  // pick target letter
  const targetLetter = rand(ALEPH_BET);
  const targetWords  = WORD_DB.filter(w => w.letter === targetLetter.letter);
  if (!targetWords.length) { buildPictureRound(); return; } // fallback
  const correctWord  = rand(targetWords);

  // pick 2 distractor words from DIFFERENT letters
  const otherWords = WORD_DB.filter(w => w.letter !== targetLetter.letter);
  const distractors = shuffle(otherWords).slice(0, 2);

  const three = shuffle([correctWord, ...distractors]);

  // show letter
  const dl = document.getElementById('display-letter');
  dl.textContent = targetLetter.letter;
  dl.style.display = 'block';

  currentAudio = targetLetter.name; // say the letter name

  const grid = document.getElementById('pictures-grid');
  grid.innerHTML = '';
  three.forEach(item => {
    const card = document.createElement('div');
    card.className = 'picture-card';
    card.innerHTML = `<div class="pic-emoji">${item.emoji}</div><div class="pic-word">${item.word}</div>`;
    card.addEventListener('click', () => onPick(card, item === correctWord));
    grid.appendChild(card);
  });
}

// ─── Answer handling ───────────────────────────────────
function onPick(card, isCorrect) {
  if (answered || card.classList.contains('eliminated') || card.classList.contains('disabled')) return;

  if (isCorrect) {
    answered = true;
    card.classList.add('card-correct', 'disabled');
    // disable remaining cards
    document.querySelectorAll('.letter-card, .picture-card').forEach(c => c.classList.add('disabled'));
    score++;
    round++;
    const praise = ['כל הכבוד! 🎉','נהדר! ⭐','מצוין! 🌟','אחלה! 🎈','ברכות! 💫','וואו! 🔥'];
    setFeedback(rand(praise), 'fb-correct');
    launchConfetti();
    setTimeout(() => document.getElementById('next-btn').classList.add('visible'), 700);
  } else {
    card.classList.add('card-wrong');
    setTimeout(() => {
      // eliminate this wrong card — keep others clickable
      card.classList.remove('card-wrong');
      card.classList.add('eliminated');
    }, 450);
    const comfort = ['לא זו — נסה שוב 💙','כמעט! 🌈','אוף! נסה עוד פעם 🙈'];
    setFeedback(rand(comfort), 'fb-wrong');
  }
}

// ═══════════════════════════════════════════════════════
//  CONFETTI
// ═══════════════════════════════════════════════════════
(function(){
  const canvas = document.getElementById('confetti-canvas');
  const ctx = canvas.getContext('2d');
  let parts = [], running = false;
  const COLORS = ['#ff6b6b','#ffd93d','#6bcb77','#4d96ff','#c77dff','#f093fb','#ff9a56'];
  function resize(){ canvas.width = innerWidth; canvas.height = innerHeight; }
  addEventListener('resize', resize); resize();
  function step(){
    if(!running) return;
    ctx.clearRect(0,0,canvas.width,canvas.height);
    parts = parts.filter(p => p.opacity > .05);
    parts.forEach(p => {
      p.x += p.vx; p.y += p.vy; p.rotation += p.rotSpeed; p.vy += .09;
      if(p.y > canvas.height*.7) p.opacity -= .02;
      ctx.save(); ctx.globalAlpha = p.opacity;
      ctx.translate(p.x, p.y); ctx.rotate(p.rotation*Math.PI/180);
      ctx.fillStyle = p.color;
      if(p.shape === 'circle'){ ctx.beginPath(); ctx.arc(0,0,p.size/2,0,Math.PI*2); ctx.fill(); }
      else { ctx.fillRect(-p.size/2,-p.size/4,p.size,p.size/2); }
      ctx.restore();
    });
    if(parts.length) requestAnimationFrame(step);
    else { running = false; ctx.clearRect(0,0,canvas.width,canvas.height); }
  }
  window.launchConfetti = function(){
    for(let i=0;i<90;i++) parts.push({
      x:Math.random()*canvas.width, y:-20,
      vx:(Math.random()-.5)*4, vy:2+Math.random()*4,
      size:8+Math.random()*10, color:COLORS[Math.floor(Math.random()*COLORS.length)],
      rotation:Math.random()*360, rotSpeed:(Math.random()-.5)*6,
      shape:Math.random()>.5?'rect':'circle', opacity:1,
    });
    if(!running){ running=true; step(); }
  };
})();

// ═══════════════════════════════════════════════════════
//  INIT — wait for voices to load
// ═══════════════════════════════════════════════════════
function init(){
  nextRound();
}

if(window.speechSynthesis){
  // voices may load async
  if(speechSynthesis.getVoices().length){ init(); }
  else { speechSynthesis.addEventListener('voiceschanged', init, {once:true}); setTimeout(init, 800); }
} else { init(); }
</script>
</body>
</html>
