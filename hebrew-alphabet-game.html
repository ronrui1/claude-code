<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>משחק האותיות</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{
      font-family:'Segoe UI',Arial,sans-serif;
      background:linear-gradient(135deg,#ffecd2 0%,#fcb69f 50%,#a1c4fd 100%);
      min-height:100vh;display:flex;flex-direction:column;
      align-items:center;justify-content:center;
      overflow-x:hidden;user-select:none;
    }
    /* background blobs */
    .bg{position:fixed;inset:0;pointer-events:none;z-index:0}
    .blob{position:absolute;border-radius:50%;opacity:.18;animation:fl 6s ease-in-out infinite}
    .blob:nth-child(1){width:120px;height:120px;background:#ff6b6b;top:5%;left:10%;animation-delay:0s}
    .blob:nth-child(2){width:80px;height:80px;background:#ffd93d;top:15%;left:75%;animation-delay:1s}
    .blob:nth-child(3){width:160px;height:160px;background:#6bcb77;top:65%;left:5%;animation-delay:2s}
    .blob:nth-child(4){width:100px;height:100px;background:#4d96ff;top:70%;left:80%;animation-delay:.5s}
    .blob:nth-child(5){width:60px;height:60px;background:#ff6b6b;top:40%;left:90%;animation-delay:1.5s}
    .blob:nth-child(6){width:90px;height:90px;background:#c77dff;top:85%;left:45%;animation-delay:3s}
    @keyframes fl{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-20px) scale(1.05)}}

    /* card */
    .card{
      position:relative;z-index:1;
      background:rgba(255,255,255,.92);backdrop-filter:blur(12px);
      border-radius:32px;padding:24px 32px 32px;
      max-width:720px;width:96%;
      box-shadow:0 20px 60px rgba(0,0,0,.15),0 4px 16px rgba(0,0,0,.08);
      text-align:center;
    }

    /* top row */
    .top-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
    .pill{
      background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;
      border-radius:20px;padding:5px 18px;font-size:1rem;font-weight:700;
      box-shadow:0 4px 12px rgba(102,126,234,.35);
    }

    /* difficulty bar */
    .diff-bar{
      display:flex;align-items:center;justify-content:center;
      gap:8px;margin-bottom:16px;flex-wrap:wrap;
    }
    .diff-label{font-size:.9rem;font-weight:700;color:#888}
    .diff-btn{
      border:3px solid #ddd;background:#f8f8f8;border-radius:20px;
      padding:5px 16px;font-size:.9rem;font-weight:700;cursor:pointer;
      color:#666;transition:all .2s;
    }
    .diff-btn:hover{border-color:#a29bfe;color:#6c5ce7}
    .diff-btn.active{
      background:linear-gradient(135deg,#667eea,#764ba2);
      border-color:#667eea;color:#fff;
      box-shadow:0 4px 12px rgba(102,126,234,.4);
    }

    /* mode badge */
    .mode-badge{
      display:inline-block;
      background:linear-gradient(135deg,#f093fb,#f5576c);color:#fff;
      border-radius:14px;padding:5px 20px;font-size:1rem;font-weight:700;
      margin-bottom:16px;box-shadow:0 4px 12px rgba(240,93,251,.3);
    }

    /* prompt row */
    .prompt-row{
      display:flex;align-items:center;justify-content:center;
      gap:14px;margin-bottom:22px;
    }
    .display-letter{
      font-size:5.5rem;font-weight:900;line-height:1;
      background:linear-gradient(135deg,#667eea,#764ba2);
      -webkit-background-clip:text;-webkit-text-fill-color:transparent;
      background-clip:text;
    }
    .speak-btn{
      background:linear-gradient(135deg,#43e97b,#38f9d7);
      border:none;border-radius:50%;width:60px;height:60px;
      font-size:1.8rem;cursor:pointer;
      box-shadow:0 4px 14px rgba(67,233,123,.4);
      transition:transform .15s;flex-shrink:0;
    }
    .speak-btn:hover{transform:scale(1.12)}
    .speak-btn:active{transform:scale(.95)}

    /* letter cards */
    .letters-grid{display:flex;gap:14px;justify-content:center;margin-bottom:18px;flex-wrap:wrap}
    .lcard{
      width:140px;height:140px;border-radius:22px;
      display:flex;align-items:center;justify-content:center;
      font-size:4.8rem;font-weight:900;cursor:pointer;
      border:4px solid transparent;
      transition:transform .15s,box-shadow .15s,opacity .3s;
      box-shadow:0 8px 24px rgba(0,0,0,.12);
    }
    .lcard:nth-child(1){background:linear-gradient(135deg,#ffeaa7,#fdcb6e);color:#6c4a00}
    .lcard:nth-child(2){background:linear-gradient(135deg,#a29bfe,#6c5ce7);color:#fff}
    .lcard:nth-child(3){background:linear-gradient(135deg,#55efc4,#00b894);color:#004d39}
    .lcard:nth-child(4){background:linear-gradient(135deg,#fd79a8,#e84393);color:#fff}
    .lcard:nth-child(5){background:linear-gradient(135deg,#74b9ff,#0984e3);color:#fff}

    /* picture cards */
    .pics-grid{display:flex;gap:12px;justify-content:center;margin-bottom:18px;flex-wrap:wrap}
    .pcard{
      width:155px;border-radius:20px;
      display:flex;flex-direction:column;align-items:center;
      padding:14px 8px 10px;gap:8px;cursor:pointer;
      border:4px solid transparent;
      transition:transform .15s,box-shadow .15s,opacity .3s;
      box-shadow:0 8px 24px rgba(0,0,0,.12);
    }
    .pcard:nth-child(1){background:linear-gradient(135deg,#fff3b0,#ffd166)}
    .pcard:nth-child(2){background:linear-gradient(135deg,#e0d4fb,#b5a3f5)}
    .pcard:nth-child(3){background:linear-gradient(135deg,#b8f5db,#55efc4)}
    .pcard:nth-child(4){background:linear-gradient(135deg,#ffd6e7,#ffaac5)}
    .pcard:nth-child(5){background:linear-gradient(135deg,#c8f0ff,#48cae4)}
    .pic-img{font-size:4rem;line-height:1}
    .pic-word{
      font-size:1.1rem;font-weight:800;color:#333;
      background:rgba(255,255,255,.6);border-radius:10px;
      padding:3px 10px;white-space:nowrap;
    }
    .pcard:nth-child(2) .pic-word,.pcard:nth-child(4) .pic-word{color:#3d1a6e}

    /* shared hover/active/states */
    .lcard:hover:not(.elim):not(.off),
    .pcard:hover:not(.elim):not(.off){transform:translateY(-5px) scale(1.04);box-shadow:0 16px 40px rgba(0,0,0,.2)}
    .lcard:active:not(.elim):not(.off),
    .pcard:active:not(.elim):not(.off){transform:scale(.97)}

    .hit {border-color:#00b894!important;animation:boop .5s ease}
    .miss{border-color:#e17055!important;animation:shake .45s ease}
    .elim{opacity:.28;cursor:default;pointer-events:none;transform:scale(.9)}
    .off {cursor:default;pointer-events:none}

    @keyframes boop{0%{transform:scale(1)}30%{transform:scale(1.22)}60%{transform:scale(.93)}100%{transform:scale(1)}}
    @keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}40%{transform:translateX(9px)}60%{transform:translateX(-7px)}80%{transform:translateX(7px)}}

    /* feedback */
    .fb{
      font-size:1.45rem;font-weight:800;min-height:2.4rem;
      display:flex;align-items:center;justify-content:center;
      border-radius:14px;padding:6px 20px;
    }
    .fb-ok  {color:#00b894;background:rgba(0,184,148,.12)}
    .fb-bad {color:#e17055;background:rgba(225,112,85,.12)}
    .fb-nil {color:transparent;background:transparent}

    /* confetti */
    #cc{position:fixed;inset:0;pointer-events:none;z-index:10}

    /* responsive */
    @media(max-width:500px){
      .card{padding:16px 12px 24px}
      .lcard{width:88px;height:88px;font-size:3rem;border-radius:16px}
      .pcard{width:96px;padding:10px 5px 8px}
      .pic-img{font-size:2.6rem}
      .pic-word{font-size:.85rem}
      .display-letter{font-size:4rem}
      .speak-btn{width:50px;height:50px;font-size:1.5rem}
    }
  </style>
</head>
<body>
<div class="bg">
  <div class="blob"></div><div class="blob"></div><div class="blob"></div>
  <div class="blob"></div><div class="blob"></div><div class="blob"></div>
</div>
<canvas id="cc"></canvas>

<div class="card">
  <!-- score row -->
  <div class="top-row">
    <div class="pill">⭐ <span id="score">0</span></div>
    <div class="pill">שאלה <span id="qnum">1</span></div>
  </div>

  <!-- difficulty selector -->
  <div class="diff-bar">
    <span class="diff-label">רמת קושי:</span>
    <button class="diff-btn active" onclick="setDiff(3,this)">מתחילים ★</button>
    <button class="diff-btn"        onclick="setDiff(4,this)">מתקדמים ★★</button>
    <button class="diff-btn"        onclick="setDiff(5,this)">מומחים ★★★</button>
  </div>

  <!-- mode label -->
  <div class="mode-badge" id="mbadge"></div>

  <!-- letter display + speak button -->
  <div class="prompt-row">
    <div class="display-letter" id="dletter" style="display:none"></div>
    <button class="speak-btn" onclick="replayAudio()" title="השמע שוב">🔊</button>
  </div>

  <!-- grids -->
  <div class="letters-grid" id="lgrid"></div>
  <div class="pics-grid"    id="pgrid"></div>

  <!-- feedback -->
  <div class="fb fb-nil" id="fb">&#x200F;</div>
</div>

<script>
// ── DATA ────────────────────────────────────────────────────────────────
// n = display name | TTS uses the raw letter (l) so Siri reads the letter name
const AB = [
  {l:'א',n:'אלף'},{l:'ב',n:'בית'},{l:'ג',n:'גימל'},
  {l:'ד',n:'דלת'},{l:'ה',n:'הא'},{l:'ו',n:'וו'},
  {l:'ז',n:'זין'},{l:'ח',n:'חית'},{l:'ט',n:'טית'},
  {l:'י',n:'יוד'},{l:'כ',n:'כף'},{l:'ל',n:'למד'},
  {l:'מ',n:'מם'},{l:'נ',n:'נון'},{l:'ס',n:'סמך'},
  {l:'ע',n:'עין'},{l:'פ',n:'פה'},{l:'צ',n:'צדי'},
  {l:'ק',n:'קוף'},{l:'ר',n:'ריש'},{l:'ש',n:'שין'},
  {l:'ת',n:'תו'},
];

const PICS = [
  {l:'א',e:'🦁',w:'אריה'},   {l:'א',e:'🐰',w:'ארנב'},
  {l:'א',e:'🍉',w:'אבטיח'},  {l:'א',e:'🚌',w:'אוטובוס'},
  {l:'ב',e:'🦆',w:'ברווז'},  {l:'ב',e:'🏠',w:'בית'},
  {l:'ב',e:'🎈',w:'בלון'},   {l:'ב',e:'🍌',w:'בננה'},
  {l:'ג',e:'🐪',w:'גמל'},    {l:'ג',e:'🥕',w:'גזר'},
  {l:'ג',e:'🍦',w:'גלידה'},
  {l:'ד',e:'🐟',w:'דג'},     {l:'ד',e:'🧸',w:'דובי'},
  {l:'ד',e:'🦕',w:'דינוזאור'},
  {l:'ה',e:'⛰️',w:'הר'},    {l:'ה',e:'🚁',w:'הליקופטר'},
  {l:'ו',e:'🌹',w:'ורד'},    {l:'ו',e:'🧇',w:'וופל'},
  {l:'ז',e:'🦓',w:'זברה'},   {l:'ז',e:'🐛',w:'זחל'},
  {l:'ח',e:'🐱',w:'חתול'},   {l:'ח',e:'🌻',w:'חמנייה'},
  {l:'ח',e:'🥛',w:'חלב'},
  {l:'ט',e:'🐯',w:'טיגריס'}, {l:'ט',e:'📱',w:'טלפון'},
  {l:'ט',e:'🚜',w:'טרקטור'},
  {l:'י',e:'👦',w:'ילד'},    {l:'י',e:'🌊',w:'ים'},
  {l:'י',e:'🌙',w:'ירח'},
  {l:'כ',e:'🐕',w:'כלב'},    {l:'כ',e:'⭐',w:'כוכב'},
  {l:'כ',e:'⚽',w:'כדור'},
  {l:'ל',e:'❤️',w:'לב'},    {l:'ל',e:'🍋',w:'לימון'},
  {l:'ל',e:'🥖',w:'לחם'},
  {l:'מ',e:'🚗',w:'מכונית'}, {l:'מ',e:'✈️',w:'מטוס'},
  {l:'מ',e:'☂️',w:'מטרייה'},
  {l:'נ',e:'🐍',w:'נחש'},    {l:'נ',e:'🐆',w:'נמר'},
  {l:'נ',e:'🐜',w:'נמלה'},
  {l:'ס',e:'🐎',w:'סוס'},    {l:'ס',e:'⛵',w:'סירה'},
  {l:'ס',e:'🍬',w:'סוכרייה'},
  {l:'ע',e:'🌳',w:'עץ'},     {l:'ע',e:'🐭',w:'עכבר'},
  {l:'ע',e:'🍰',w:'עוגה'},
  {l:'פ',e:'🐘',w:'פיל'},    {l:'פ',e:'🐄',w:'פרה'},
  {l:'פ',e:'🦋',w:'פרפר'},   {l:'פ',e:'🌸',w:'פרח'},
  {l:'צ',e:'🐢',w:'צב'},     {l:'צ',e:'🐦',w:'ציפור'},
  {l:'צ',e:'🐸',w:'צפרדע'},
  {l:'ק',e:'🐒',w:'קוף'},    {l:'ק',e:'🦔',w:'קיפוד'},
  {l:'ק',e:'🌈',w:'קשת'},
  {l:'ר',e:'🚂',w:'רכבת'},   {l:'ר',e:'🤖',w:'רובוט'},
  {l:'ש',e:'☀️',w:'שמש'},   {l:'ש',e:'🐇',w:'שפן'},
  {l:'ש',e:'🍫',w:'שוקולד'},
  {l:'ת',e:'🍓',w:'תות'},    {l:'ת',e:'🍎',w:'תפוח'},
  {l:'ת',e:'🐊',w:'תנין'},
];

// ── STATE ────────────────────────────────────────────────────────────────
let score=0, qnum=1, diff=3, mode='letter';
let answered=false, advTimer=null, currentAudio='';
let recentL=[];

// ── AUDIO — TTS only (Web Audio removed; Siri is the sound engine) ───────

// ── TTS ───────────────────────────────────────────────────────────────────
function speak(txt){
  if(!window.speechSynthesis)return;
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(txt);
  u.lang='he-IL'; u.rate=0.82; u.pitch=1.15;
  const hv=speechSynthesis.getVoices().find(v=>v.lang.startsWith('he'));
  if(hv) u.voice=hv;
  speechSynthesis.speak(u);
}
function replayAudio(){ if(currentAudio) speak(currentAudio); }

// ── UTILS ─────────────────────────────────────────────────────────────────
const rnd=arr=>arr[Math.floor(Math.random()*arr.length)];
const shuf=arr=>[...arr].sort(()=>Math.random()-.5);

function fb(txt,cls){
  const el=document.getElementById('fb');
  el.textContent=txt||'\u200F';
  el.className='fb '+(cls||'fb-nil');
}

function setDiff(n,btn){
  diff=n;
  document.querySelectorAll('.diff-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  if(advTimer){clearTimeout(advTimer);advTimer=null;}
  startRound();
}

// ── ROUNDS ────────────────────────────────────────────────────────────────
function startRound(){
  answered=false;
  fb('','fb-nil');
  document.getElementById('qnum').textContent=qnum;
  document.getElementById('score').textContent=score;
  mode=(qnum%2===1)?'letter':'picture';
  if(mode==='letter') buildLetterRound();
  else                buildPictureRound();
  setTimeout(()=>speak(currentAudio),400);
}

function advanceRound(){
  qnum++;
  startRound();
}

// Mode A ─────────────────────────────────────────────────────────────────
function buildLetterRound(){
  document.getElementById('mbadge').textContent='מצא את האות 🔡';
  document.getElementById('dletter').style.display='none';
  document.getElementById('pgrid').innerHTML='';

  // pick diff unique letters, avoiding recent
  const pool=AB.filter(x=>!recentL.includes(x.l));
  const src=pool.length>=diff?pool:AB;
  const chosen=shuf(src).slice(0,diff);
  chosen.forEach(x=>{recentL.push(x.l)});
  if(recentL.length>10) recentL=recentL.slice(-10);

  const correct=rnd(chosen);
  currentAudio='תמצאי את האות '+correct.l;

  const g=document.getElementById('lgrid');
  g.innerHTML='';
  shuf(chosen).forEach(item=>{
    const c=document.createElement('div');
    c.className='lcard';
    c.textContent=item.l;
    c.addEventListener('click',()=>pick(c,item.l===correct.l,'lgrid',item.l));
    g.appendChild(c);
  });
}

// Mode B ─────────────────────────────────────────────────────────────────
function buildPictureRound(){
  document.getElementById('mbadge').textContent='מה מתחיל ב... 🖼️';
  document.getElementById('lgrid').innerHTML='';

  const target=rnd(AB);
  const tWords=PICS.filter(p=>p.l===target.l);
  if(!tWords.length){buildPictureRound();return;}
  const correct=rnd(tWords);

  const others=PICS.filter(p=>p.l!==target.l&&p.e!==correct.e);
  const distr=shuf(others).slice(0,diff-1);
  const cards=shuf([correct,...distr]);

  const dl=document.getElementById('dletter');
  dl.textContent=target.l;
  dl.style.display='block';

  currentAudio='תמצאי את התמונה שמתחילה באות '+target.l;

  const g=document.getElementById('pgrid');
  g.innerHTML='';
  cards.forEach(item=>{
    const c=document.createElement('div');
    c.className='pcard';
    c.innerHTML=`<div class="pic-img">${item.e}</div><div class="pic-word">${item.w}</div>`;
    c.addEventListener('click',()=>pick(c,item===correct,'pgrid',item.w));
    g.appendChild(c);
  });
}

// ── PICK HANDLER ─────────────────────────────────────────────────────────
const PRAISE=['כל הכבוד! 🎉','נהדר! ⭐','מצוין! 🌟','אחלה! 🎈','ברכות! 💫','וואו! 🔥'];
const COMFORT=['לא זו — נסה שוב 💙','כמעט! 🌈','אוף! נסה עוד פעם 🙈'];

function pick(card,isCorrect,gridId,spokenText){
  if(answered||card.classList.contains('elim')||card.classList.contains('off')) return;

  // Say the letter or word that was tapped
  speak(spokenText);

  if(isCorrect){
    answered=true;
    card.classList.add('hit','off');
    document.querySelectorAll(`#${gridId} > div`).forEach(c=>c.classList.add('off'));
    score++;
    fb(rnd(PRAISE),'fb-ok');
    launchConfetti();
    advTimer=setTimeout(advanceRound,2000);
  } else {
    card.classList.add('miss');
    setTimeout(()=>{
      card.classList.remove('miss');
      card.classList.add('elim');
    },450);
    fb(rnd(COMFORT),'fb-bad');
  }
}

// ── CONFETTI ─────────────────────────────────────────────────────────────
(function(){
  const cv=document.getElementById('cc'),ctx=cv.getContext('2d');
  let pts=[],go=false;
  const CLR=['#ff6b6b','#ffd93d','#6bcb77','#4d96ff','#c77dff','#f093fb','#ff9a56'];
  function rsz(){cv.width=innerWidth;cv.height=innerHeight;}
  addEventListener('resize',rsz);rsz();
  function step(){
    if(!go)return;
    ctx.clearRect(0,0,cv.width,cv.height);
    pts=pts.filter(p=>p.op>.04);
    pts.forEach(p=>{
      p.x+=p.vx;p.y+=p.vy;p.r+=p.rs;p.vy+=.09;
      if(p.y>cv.height*.7)p.op-=.02;
      ctx.save();ctx.globalAlpha=p.op;
      ctx.translate(p.x,p.y);ctx.rotate(p.r*Math.PI/180);
      ctx.fillStyle=p.c;
      if(p.s==='c'){ctx.beginPath();ctx.arc(0,0,p.sz/2,0,Math.PI*2);ctx.fill();}
      else{ctx.fillRect(-p.sz/2,-p.sz/4,p.sz,p.sz/2);}
      ctx.restore();
    });
    if(pts.length)requestAnimationFrame(step);
    else{go=false;ctx.clearRect(0,0,cv.width,cv.height);}
  }
  window.launchConfetti=function(){
    for(let i=0;i<90;i++)pts.push({
      x:Math.random()*cv.width,y:-20,
      vx:(Math.random()-.5)*4,vy:2+Math.random()*4,
      sz:8+Math.random()*10,c:CLR[Math.floor(Math.random()*CLR.length)],
      r:Math.random()*360,rs:(Math.random()-.5)*6,
      s:Math.random()>.5?'r':'c',op:1,
    });
    if(!go){go=true;step();}
  };
})();

// ── INIT ─────────────────────────────────────────────────────────────────
function init(){startRound();}
if(window.speechSynthesis){
  if(speechSynthesis.getVoices().length){init();}
  else{speechSynthesis.addEventListener('voiceschanged',init,{once:true});setTimeout(init,800);}
}else{init();}
</script>
</body>
</html>
