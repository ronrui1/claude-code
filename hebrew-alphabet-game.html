<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>משחק האותיות</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 50%, #a1c4fd 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      user-select: none;
    }

    /* Floating background shapes */
    .bg-shapes { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
    .shape {
      position: absolute;
      border-radius: 50%;
      opacity: 0.18;
      animation: float 6s ease-in-out infinite;
    }
    .shape:nth-child(1)  { width:120px;height:120px;background:#ff6b6b;top:5%;left:10%;animation-delay:0s; }
    .shape:nth-child(2)  { width: 80px;height: 80px;background:#ffd93d;top:15%;left:75%;animation-delay:1s; }
    .shape:nth-child(3)  { width:160px;height:160px;background:#6bcb77;top:65%;left: 5%;animation-delay:2s; }
    .shape:nth-child(4)  { width:100px;height:100px;background:#4d96ff;top:70%;left:80%;animation-delay:0.5s; }
    .shape:nth-child(5)  { width: 60px;height: 60px;background:#ff6b6b;top:40%;left:90%;animation-delay:1.5s; }
    .shape:nth-child(6)  { width: 90px;height: 90px;background:#c77dff;top:85%;left:45%;animation-delay:3s; }

    @keyframes float {
      0%,100% { transform: translateY(0) scale(1); }
      50%      { transform: translateY(-20px) scale(1.05); }
    }

    /* Main card */
    .game-card {
      position: relative;
      z-index: 1;
      background: rgba(255,255,255,0.88);
      backdrop-filter: blur(12px);
      border-radius: 32px;
      padding: 40px 48px 48px;
      max-width: 680px;
      width: 95%;
      box-shadow: 0 20px 60px rgba(0,0,0,0.15), 0 4px 16px rgba(0,0,0,0.08);
      text-align: center;
    }

    /* Score bar */
    .score-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 28px;
    }
    .score-pill {
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: #fff;
      border-radius: 20px;
      padding: 6px 20px;
      font-size: 1.1rem;
      font-weight: 700;
      box-shadow: 0 4px 12px rgba(102,126,234,0.4);
    }
    .stars-display {
      font-size: 1.4rem;
      letter-spacing: 2px;
    }

    /* Prompt area */
    .prompt-area { margin-bottom: 36px; }
    .prompt-label {
      font-size: 1.25rem;
      color: #888;
      margin-bottom: 8px;
      font-weight: 600;
    }
    .target-letter-name {
      font-size: 3.2rem;
      font-weight: 900;
      background: linear-gradient(135deg, #f093fb, #f5576c);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      line-height: 1.1;
      animation: pulse-name 2s ease-in-out infinite;
    }
    @keyframes pulse-name {
      0%,100% { transform: scale(1); }
      50%      { transform: scale(1.04); }
    }

    /* Letter cards grid */
    .letters-grid {
      display: flex;
      gap: 20px;
      justify-content: center;
      margin-bottom: 32px;
    }

    .letter-card {
      width: 160px;
      height: 160px;
      border-radius: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 5.5rem;
      font-weight: 900;
      cursor: pointer;
      border: 4px solid transparent;
      transition: transform 0.15s, box-shadow 0.15s, border-color 0.15s;
      position: relative;
      overflow: hidden;
      box-shadow: 0 8px 24px rgba(0,0,0,0.12);
    }
    .letter-card::before {
      content: '';
      position: absolute;
      inset: 0;
      opacity: 0.15;
      border-radius: inherit;
    }

    .letter-card:nth-child(1) { background: linear-gradient(135deg, #ffeaa7, #fdcb6e); color: #6c4a00; }
    .letter-card:nth-child(2) { background: linear-gradient(135deg, #a29bfe, #6c5ce7); color: #fff; }
    .letter-card:nth-child(3) { background: linear-gradient(135deg, #55efc4, #00b894); color: #004d39; }

    .letter-card:hover:not(.disabled) {
      transform: translateY(-6px) scale(1.04);
      box-shadow: 0 16px 40px rgba(0,0,0,0.2);
    }
    .letter-card:active:not(.disabled) { transform: scale(0.97); }

    .letter-card.correct {
      border-color: #00b894;
      animation: bounce-correct 0.5s ease;
    }
    .letter-card.wrong {
      border-color: #e17055;
      animation: shake-wrong 0.45s ease;
    }
    .letter-card.disabled { cursor: default; pointer-events: none; }

    @keyframes bounce-correct {
      0%   { transform: scale(1); }
      30%  { transform: scale(1.25); }
      60%  { transform: scale(0.92); }
      100% { transform: scale(1); }
    }
    @keyframes shake-wrong {
      0%,100% { transform: translateX(0); }
      20%      { transform: translateX(-10px); }
      40%      { transform: translateX(10px); }
      60%      { transform: translateX(-8px); }
      80%      { transform: translateX(8px); }
    }

    /* Feedback message */
    .feedback {
      font-size: 1.5rem;
      font-weight: 800;
      min-height: 2.4rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      border-radius: 16px;
      padding: 8px 24px;
      transition: opacity 0.3s;
    }
    .feedback.correct { color: #00b894; background: rgba(0,184,148,0.1); }
    .feedback.wrong   { color: #e17055; background: rgba(225,112,85,0.1); }
    .feedback.empty   { color: transparent; background: transparent; }

    /* Confetti canvas */
    #confetti-canvas {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 10;
    }

    /* Next button */
    .next-btn {
      display: none;
      margin: 20px auto 0;
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: #fff;
      border: none;
      border-radius: 50px;
      padding: 16px 48px;
      font-size: 1.4rem;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(102,126,234,0.4);
      transition: transform 0.15s, box-shadow 0.15s;
      letter-spacing: 1px;
    }
    .next-btn:hover { transform: translateY(-3px); box-shadow: 0 12px 32px rgba(102,126,234,0.55); }
    .next-btn:active { transform: scale(0.97); }
    .next-btn.visible { display: inline-block; animation: pop-in 0.3s ease; }

    @keyframes pop-in {
      0%   { transform: scale(0.5); opacity: 0; }
      70%  { transform: scale(1.08); }
      100% { transform: scale(1); opacity: 1; }
    }

    /* Responsive */
    @media (max-width: 500px) {
      .game-card { padding: 28px 20px 36px; }
      .letter-card { width: 100px; height: 100px; font-size: 3.8rem; border-radius: 18px; }
      .target-letter-name { font-size: 2.4rem; }
      .letters-grid { gap: 12px; }
    }
  </style>
</head>
<body>

<div class="bg-shapes">
  <div class="shape"></div><div class="shape"></div><div class="shape"></div>
  <div class="shape"></div><div class="shape"></div><div class="shape"></div>
</div>

<canvas id="confetti-canvas"></canvas>

<div class="game-card">
  <div class="score-bar">
    <div class="score-pill">⭐ <span id="score">0</span></div>
    <div class="stars-display" id="stars-display"></div>
    <div class="score-pill">סיבוב <span id="round">1</span></div>
  </div>

  <div class="prompt-area">
    <div class="prompt-label">מצא את האות</div>
    <div class="target-letter-name" id="target-name">—</div>
  </div>

  <div class="letters-grid" id="letters-grid">
    <!-- cards injected by JS -->
  </div>

  <div class="feedback empty" id="feedback">‎</div>
  <button class="next-btn" id="next-btn" onclick="nextRound()">הבא ➜</button>
</div>

<script>
// ─── Hebrew alphabet data ───────────────────────────────────────────
const ALEPH_BET = [
  { letter: 'א', name: 'אלף'  },
  { letter: 'ב', name: 'בית'  },
  { letter: 'ג', name: 'גימל' },
  { letter: 'ד', name: 'דלת'  },
  { letter: 'ה', name: 'הא'   },
  { letter: 'ו', name: 'וו'   },
  { letter: 'ז', name: 'זין'  },
  { letter: 'ח', name: 'חית'  },
  { letter: 'ט', name: 'טית'  },
  { letter: 'י', name: 'יוד'  },
  { letter: 'כ', name: 'כף'   },
  { letter: 'ל', name: 'למד'  },
  { letter: 'מ', name: 'מם'   },
  { letter: 'נ', name: 'נון'  },
  { letter: 'ס', name: 'סמך'  },
  { letter: 'ע', name: 'עין'  },
  { letter: 'פ', name: 'פה'   },
  { letter: 'צ', name: 'צדי'  },
  { letter: 'ק', name: 'קוף'  },
  { letter: 'ר', name: 'ריש'  },
  { letter: 'ש', name: 'שין'  },
  { letter: 'ת', name: 'תו'   },
];

// ─── State ───────────────────────────────────────────────────────────
let score = 0;
let round = 1;
let targetIndex = null;
let answered = false;
let recentPool = [];   // avoid repeating same 3 too often

// ─── Helpers ─────────────────────────────────────────────────────────
function pick3() {
  // weighted: avoid letters used in last 2 rounds
  const pool = ALEPH_BET.filter(l => !recentPool.includes(l.letter));
  const src  = pool.length >= 3 ? pool : ALEPH_BET;
  const arr  = [...src].sort(() => Math.random() - 0.5).slice(0, 3);
  // update recent pool (keep last 6)
  arr.forEach(l => recentPool.push(l.letter));
  if (recentPool.length > 6) recentPool = recentPool.slice(-6);
  return arr;
}

function shuffle(arr) { return arr.sort(() => Math.random() - 0.5); }

// ─── Render round ────────────────────────────────────────────────────
function nextRound() {
  answered = false;
  document.getElementById('feedback').className = 'feedback empty';
  document.getElementById('feedback').textContent = '\u200F'; // RTL mark keeps height
  document.getElementById('next-btn').classList.remove('visible');

  const three = shuffle(pick3());
  targetIndex = Math.floor(Math.random() * 3);
  const target = three[targetIndex];

  document.getElementById('target-name').textContent = target.name;
  document.getElementById('round').textContent = round;
  document.getElementById('score').textContent = score;

  const grid = document.getElementById('letters-grid');
  grid.innerHTML = '';
  three.forEach((item, i) => {
    const card = document.createElement('div');
    card.className = 'letter-card';
    card.textContent = item.letter;
    card.dataset.index = i;
    card.addEventListener('click', () => onPick(card, i, i === targetIndex));
    grid.appendChild(card);
  });
}

// ─── Handle pick ─────────────────────────────────────────────────────
function onPick(card, idx, isCorrect) {
  if (answered) return;
  answered = true;

  const fb = document.getElementById('feedback');

  // Disable all cards
  document.querySelectorAll('.letter-card').forEach(c => c.classList.add('disabled'));

  if (isCorrect) {
    card.classList.add('correct');
    score++;
    round++;
    const msgs = ['כל הכבוד! 🎉', 'נהדר! ⭐', 'מצוין! 🌟', 'אחלה! 🎈', 'ברכות! 💫'];
    fb.textContent = msgs[Math.floor(Math.random() * msgs.length)];
    fb.className = 'feedback correct';
    document.getElementById('score').textContent = score;
    updateStars();
    launchConfetti();
    setTimeout(() => document.getElementById('next-btn').classList.add('visible'), 700);
  } else {
    card.classList.add('wrong');
    const msgs = ['נסה שוב 💙', 'אוף! לא זו 🙈', 'כמעט! נסה עוד פעם 🌈'];
    fb.textContent = msgs[Math.floor(Math.random() * msgs.length)];
    fb.className = 'feedback wrong';
    // Re-enable after shake
    setTimeout(() => {
      card.classList.remove('wrong', 'disabled');
      answered = false;
    }, 600);
  }
}

// ─── Stars display ───────────────────────────────────────────────────
function updateStars() {
  const milestones = [1, 3, 5, 10, 15, 20];
  const display = document.getElementById('stars-display');
  const reached = milestones.filter(m => score >= m).length;
  display.textContent = '⭐'.repeat(Math.min(reached, 5));
}

// ─── Confetti ────────────────────────────────────────────────────────
(function setupConfetti() {
  const canvas = document.getElementById('confetti-canvas');
  const ctx = canvas.getContext('2d');
  let particles = [];
  let running = false;

  function resize() {
    canvas.width  = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resize);
  resize();

  const COLORS = ['#ff6b6b','#ffd93d','#6bcb77','#4d96ff','#c77dff','#f093fb','#ff9a56'];

  function spawn() {
    for (let i = 0; i < 80; i++) {
      particles.push({
        x: Math.random() * canvas.width,
        y: -20,
        vx: (Math.random() - 0.5) * 4,
        vy: 2 + Math.random() * 4,
        size: 8 + Math.random() * 10,
        color: COLORS[Math.floor(Math.random() * COLORS.length)],
        rotation: Math.random() * 360,
        rotSpeed: (Math.random() - 0.5) * 6,
        shape: Math.random() > 0.5 ? 'rect' : 'circle',
        opacity: 1,
      });
    }
  }

  function step() {
    if (!running) return;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    particles = particles.filter(p => p.opacity > 0.05);
    particles.forEach(p => {
      p.x += p.vx;
      p.y += p.vy;
      p.rotation += p.rotSpeed;
      p.vy += 0.08; // gravity
      if (p.y > canvas.height * 0.7) p.opacity -= 0.02;
      ctx.save();
      ctx.globalAlpha = p.opacity;
      ctx.translate(p.x, p.y);
      ctx.rotate((p.rotation * Math.PI) / 180);
      ctx.fillStyle = p.color;
      if (p.shape === 'circle') {
        ctx.beginPath();
        ctx.arc(0, 0, p.size / 2, 0, Math.PI * 2);
        ctx.fill();
      } else {
        ctx.fillRect(-p.size / 2, -p.size / 4, p.size, p.size / 2);
      }
      ctx.restore();
    });
    if (particles.length > 0) requestAnimationFrame(step);
    else { running = false; ctx.clearRect(0, 0, canvas.width, canvas.height); }
  }

  window.launchConfetti = function () {
    spawn();
    if (!running) { running = true; step(); }
  };
})();

// ─── Start ───────────────────────────────────────────────────────────
nextRound();
</script>
</body>
</html>
